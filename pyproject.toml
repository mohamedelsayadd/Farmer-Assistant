[project]
name = "farm-assistant"
version = "0.1.0"
description = "Arabic farm chatbot backend using FastAPI and an OpenAI Agents SDK agent over an OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.20",
    "redis>=8.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.49.0",
    "langfuse>=4.15.3",
    "openai-agents>=0.22.3",
    "openinference-instrumentation-openai-agents>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
